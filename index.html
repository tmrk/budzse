    <script>
      // Runs before first paint so the saved theme and language never flash the wrong state.
      (function () {
        try {
          var t = localStorage.getItem('budzse-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
          var m = /\/(hu|en)\/?$/.exec(location.pathname);
          var l = m ? m[1] : localStorage.getItem('budzse-lang');
          if (l === 'en' || l === 'hu') document.documentElement.lang = l;
        } catch (e) {}
      })();
