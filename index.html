<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Büdzsé – Magyarország közpénzügyei 2000–2027</title>
    <meta name="description" content="Bevételek, kiadások, hiány, GDP és fejlesztési támogatás 2000-től 2027-ig. Terv és tény, inflációval korrigálva, minden szám mögött a hivatalos forrással." />
    <meta name="theme-color" content="#0b4a4a" />
    <link rel="icon" href="/budzse/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/budzse/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/budzse/apple-touch-icon.png" />
    <link rel="manifest" href="/budzse/site.webmanifest" />
    <link rel="canonical" href="https://tmrk.github.io/budzse/hu/" />
    <link rel="alternate" hreflang="hu" href="https://tmrk.github.io/budzse/hu/" />
    <link rel="alternate" hreflang="en" href="https://tmrk.github.io/budzse/en/" />
    <link rel="alternate" hreflang="x-default" href="https://tmrk.github.io/budzse/" />
    <meta property="og:title" content="Büdzsé – Magyarország közpénzügyei 2000–2027" />
    <meta property="og:description" content="Bevételek, kiadások, hiány, GDP és fejlesztési támogatás 2000-től 2027-ig, minden szám mögött a hivatalos forrással." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tmrk.github.io/budzse/" />
    <script>
      // Runs before first paint so the saved theme and language never flash the wrong state.
      (function () {
        try {
          var t = localStorage.getItem('budzse-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
          var m = /\/(hu|en)\/?$/.exec(location.pathname);
          var l = m ? m[1] : localStorage.getItem('budzse-lang');
          if (l === 'en' || l === 'hu') document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--shell--></div>
    <noscript>A Büdzsé interaktív grafikonjához JavaScript szükséges. Büdzsé's interactive chart needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
